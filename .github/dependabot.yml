# Weekly dependency PRs — Flutter (pub) + GitHub Actions, minor + patch
# grouped, MAJORS IGNORED.
#
# Why ignore majors: a Dependabot PR for `flutter_lints 4 → 6` or
# `battery_plus 6 → 7` is breaking-by-definition (lint-set churn,
# plugin API surface) and needs a deliberate human read of the
# changelog. The grouped minor/patch PR still ships every Monday so
# CVE / security patches arrive on autopilot.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
